# Render Blueprint for the Pact hosted sandbox demo.
# Create it in Render: New > Blueprint > select this repository.
# FREE TIERS (owner decision, 2026-10-22). Before submission, upgrade:
#   - free Postgres expires 30 days after creation (14-day grace, then deleted),
#     which is before judging ends on Dec 15 -> plan: 0.1c-256mb
#   - the free web service sleeps after 15 idle minutes (~1 min cold start;
#     PayPal retries webhooks that time out) -> plan: 0.5c-512mb
#   - Render has no free background workers, so the worker is omitted; payments
#     still recover via verified webhooks and "Check payment status".
# Secrets are prompted once at creation (sync: false); never commit them. PayPal is sandbox-only: Pact refuses any other PayPal base URL.

databases:
  - name: pact-db
    plan: free
    databaseName: pact
    user: pact
    postgresMajorVersion: "17"
    # Only Render services connect; no public database access.
    ipAllowList: []

services:
  - type: web
    name: pact-web
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    # Migrations are idempotent and serialized by an advisory lock, so running them on every start is safe.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pact-db
          property: connectionString
      # Public URL of this service, e.g. https://pact-web.onrender.com (used in review links and PayPal return URLs).
      - key: APP_ORIGIN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook ID of https://<APP_ORIGIN host>/api/paypal/webhook in the PayPal sandbox app.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      # Lets visitors create isolated synthetic demo workspaces at /demo.
      - key: PACT_DEMO_MODE
        value: "true"
      - key: PACT_DEMO_DAILY_LIMIT
        value: "200"
